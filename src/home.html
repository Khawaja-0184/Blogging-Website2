<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home - My Blog</title>
  <link rel="stylesheet" href="../styles/home.css">
</head>
<body>
  <header>
    <h1>Welcome to My Blog</h1>
    <nav>

      <a href="index.html">Index</a>
      <a href="index.html">Home</a>
     <a href="blog.html">Blog</a>
     <a href="contact.html">About Us</a>
    </nav>
  </header>

  <main>
    <section class="slider">
  <div class="slides">
    <!-- Slide 1 -->
    <input type="radio" name="radio-btn" id="radio1" checked>
    <!-- Slide 2 -->
    <input type="radio" name="radio-btn" id="radio2">
    <!-- Slide 3 -->
    <input type="radio" name="radio-btn" id="radio3">

    <div class="slide first">
      <img src="images/slider1.jpg" alt="Slide 1">
    </div>
    <div class="slide">
      <img src="images/slider2.jpg" alt="Slide 2">
    </div>
    <div class="slide">
      <img src="images/slider3.jpg" alt="Slide 3">
    </div>

    <!-- Auto navigation -->
    <div class="navigation-auto">
      <div class="auto-btn1"></div>
      <div class="auto-btn2"></div>
      <div class="auto-btn3"></div>
    </div>

    <!-- Manual navigation -->
    <div class="navigation-manual">
      <label for="radio1" class="manual-btn"></label>
      <label for="radio2" class="manual-btn"></label>
      <label for="radio3" class="manual-btn"></label>
    </div>
  </div>
</section>

    <section>
      <h2>Hello!</h2>
      <p>This is the homepage of my personal blog. Explore my latest posts and know more about me.</p>
    </section>
  </main>

  <footer>
    <p>© 2025 My Blog</p>
  </footer>
</body>
</html>
