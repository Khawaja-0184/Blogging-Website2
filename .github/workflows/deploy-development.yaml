name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop   # ✅ triggered on any push to develop

permissions:
  pages: write
  id-token: write

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Parcel
        run: npm install parcel

      - name: Build Website
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
